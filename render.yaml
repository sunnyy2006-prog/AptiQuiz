services:
  - type: web
    name: aptiquiz
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/aptiquiz.db
      - key: CLIENT_ORIGIN
        sync: false
    disk:
      name: aptiquiz-data
      mountPath: /var/data
      sizeGB: 1
